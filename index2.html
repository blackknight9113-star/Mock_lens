<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mock Lens — Complete SSC & Railway mock test analysis, Mock Challenges, weak-topic tracking, Testbook AI auto-fill, flashcard re-attempts, and spaced revision plans. Works offline.">
<title>Mock Lens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
   <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0F172A">
   
<style>
/* ==========================================================================
   MOCK LENS v4 — MODERN BENTO + TACTILE GLASS DESIGN SYSTEM
   ========================================================================== */
:root{
  --bg:#F4F6FB;
  --bg-grad-1:rgba(79,70,229,.09);
  --bg-grad-2:rgba(14,165,233,.07);
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --glass:rgba(255,255,255,.82);
  --ink:#0F172A;
  --muted:#64748B;
  --line:#E2E8F0;
  --soft:#EEF2F6;

  /* SSC Royal Indigo & Railway Warm Amber */
  --ssc:#4F46E5;
  --ssc-2:#7C3AED;
  --rail:#D97706;
  --rail-2:#EA580C;
  --accent:var(--ssc);
  --accent-2:var(--ssc-2);
  --on-accent:#FFFFFF;

  /* Semantic Status */
  --good:#059669; --good-bg:#ECFDF5; --good-border:#A7F3D0;
  --warn:#D97706; --warn-bg:#FFFBEB; --warn-border:#FDE68A;
  --bad:#E11D48;  --bad-bg:#FFF1F2;  --bad-border:#FECDD3;

  /* Typography */
  --f-head:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;

  /* Elevation & Radii */
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:24px;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 4px 12px -2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.03);
  --shadow-md:0 14px 32px -12px rgba(15,23,42,.10),0 4px 10px -4px rgba(15,23,42,.04);
  --shadow-glow:0 10px 24px -8px color-mix(in srgb,var(--accent) 45%,transparent);
}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070B14;
  --bg-grad-1:rgba(99,102,241,.16);
  --bg-grad-2:rgba(56,189,248,.10);
  --surface:#0F1626;
  --surface-2:#141D31;
  --glass:rgba(15,22,38,.82);
  --ink:#F1F5F9;
  --muted:#94A3B8;
  --line:#1E293B;
  --soft:#172033;
  --ssc:#818CF8;
  --ssc-2:#A78BFA;
  --rail:#FBBF24;
  --rail-2:#FB923C;
  --on-accent:#070B14;
  --good:#34D399; --good-bg:rgba(16,185,129,.13); --good-border:rgba(52,211,153,.28);
  --warn:#FBBF24; --warn-bg:rgba(245,158,11,.13); --warn-border:rgba(251,191,36,.28);
  --bad:#FB7185;  --bad-bg:rgba(244,63,94,.14);  --bad-border:rgba(251,113,133,.28);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 6px 16px -4px rgba(0,0,0,.45);
  --shadow-md:0 18px 40px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}}

:root[data-theme="dark"]{
  --bg:#070B14;
  --bg-grad-1:rgba(99,102,241,.16);
  --bg-grad-2:rgba(56,189,248,.10);
  --surface:#0F1626;
  --surface-2:#141D31;
  --glass:rgba(15,22,38,.82);
  --ink:#F1F5F9;
  --muted:#94A3B8;
  --line:#1E293B;
  --soft:#172033;
  --ssc:#818CF8;
  --ssc-2:#A78BFA;
  --rail:#FBBF24;
  --rail-2:#FB923C;
  --on-accent:#070B14;
  --good:#34D399; --good-bg:rgba(16,185,129,.13); --good-border:rgba(52,211,153,.28);
  --warn:#FBBF24; --warn-bg:rgba(245,158,11,.13); --warn-border:rgba(251,191,36,.28);
  --bad:#FB7185;  --bad-bg:rgba(244,63,94,.14);  --bad-border:rgba(251,113,133,.28);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 6px 16px -4px rgba(0,0,0,.45);
  --shadow-md:0 18px 40px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}

body[data-fam="rail"]{--accent:var(--rail);--accent-2:var(--rail-2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 420px at 85% -10%,var(--bg-grad-1),transparent 65%),
    radial-gradient(700px 380px at 10% 15%,var(--bg-grad-2),transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);z-index:40}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
h2{font-size:1.22rem}
h3{font-size:1.02rem}
a{color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App Shell */
.shell{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .24s cubic-bezier(.2,.8,.2,1)}
.shell.collapsed{grid-template-columns:72px minmax(0,1fr)}
.side{
  position:sticky;top:0;align-self:start;height:100vh;
  padding:20px 14px;
  border-right:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;overflow-x:hidden;
  transition:padding .24s ease;
}
.shell.collapsed .side{padding:20px 10px;align-items:center}
.side-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.shell.collapsed .side-hd{justify-content:center}
.brand{
  font-family:var(--f-head);font-weight:800;font-size:1.24rem;letter-spacing:-.03em;
  display:flex;align-items:center;gap:10px;padding:0 4px;white-space:nowrap;
}
.shell.collapsed .brand-txt,.shell.collapsed .nav-txt,.shell.collapsed .side-foot{display:none}
.side-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);display:grid;place-items:center;
  cursor:pointer;flex:none;transition:all .16s ease;
}
.side-btn:hover{color:var(--ink);border-color:var(--accent);background:var(--soft)}
.side-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;transition:transform .24s ease}
.shell.collapsed .side-btn svg{transform:rotate(180deg)}
.shell.collapsed .nav{width:100%;align-items:center}
.shell.collapsed .nav a{justify-content:center;padding:11px;width:44px;height:44px}
.shell.collapsed .nav a:hover{transform:none}
.logo{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  box-shadow:var(--shadow-glow);
}
.logo svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}

.nav{display:flex;flex-direction:column;gap:3px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;
  color:var(--muted);text-decoration:none;font-weight:600;font-size:.91rem;
  transition:all .18s cubic-bezier(.2,.8,.2,1);
}
.nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.nav a:hover{background:var(--soft);color:var(--ink);transform:translateX(2px)}
.nav a.on{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),color-mix(in srgb,var(--accent-2) 8%,var(--surface)));
  color:var(--ink);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent),var(--shadow-xs);
}
.nav a.on svg{color:var(--accent)}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  padding-block:12px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
}
.top .l,.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.main{
  width:100%;max-width:1060px;margin:0 auto;
  padding-block:20px 58px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px;
}
.bar{display:none}

/* Built-in Top Timer Widget */
.timer-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:3px 6px 3px 11px;
  font-size:.82rem;font-weight:700;box-shadow:var(--shadow-xs);
}
.timer-pill.running{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.timer-pill.done{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.tbtn{
  border:0;background:var(--soft);color:var(--ink);
  border-radius:99px;padding:3px 8px;font-size:.74rem;font-weight:700;cursor:pointer;
}
.tbtn:hover{background:var(--accent);color:var(--on-accent)}

/* Pills & Badges */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.75rem;font-weight:700;letter-spacing:.01em;
  padding:4px 10px;border-radius:99px;
  background:var(--soft);color:var(--muted);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  white-space:nowrap;
}
.pill.good{background:var(--good-bg);color:var(--good);border-color:var(--good-border)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-border)}
.pill.acc{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent);border:0;
  box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 55%,transparent);
}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 25%,transparent)}

/* Tactile Buttons */
.btn{
  border:1px solid var(--line);
  background:var(--surface);
  padding:9px 15px;border-radius:11px;
  font-weight:600;font-size:.9rem;cursor:pointer;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:var(--shadow-xs);
  transition:transform .14s ease,box-shadow .18s ease,background .15s ease,border-color .15s ease;
}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:color-mix(in srgb,var(--muted) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active:not(:disabled){transform:translateY(0) scale(.985)}
.btn.pri{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:0;color:var(--on-accent);
  box-shadow:var(--shadow-glow);
}
.btn.pri:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.good{color:var(--good);border-color:var(--good-border);background:var(--good-bg)}
.btn.bad{color:var(--bad);border-color:var(--bad-border);background:var(--bad-bg)}
.btn.sm{padding:5px 11px;min-height:33px;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.48;cursor:not-allowed}

/* Bento Cards & Sections */
.sec{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:20px;
  display:flex;flex-direction:column;gap:14px;
  min-width:0;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.sec:hover{border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.sec>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.84rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Hero Banner */
.hero{
  display:flex;gap:24px;align-items:center;
  padding:26px 28px;border-radius:var(--r-xl);
  color:#FFFFFF;
  background:
    radial-gradient(500px 260px at 95% 10%,rgba(255,255,255,.18),transparent 65%),
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%,#090D16),color-mix(in srgb,var(--accent-2) 65%,#090D16));
  box-shadow:0 20px 44px -18px color-mix(in srgb,var(--accent) 60%,#000);
  position:relative;overflow:hidden;min-width:0;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:18px 18px;opacity:.35;pointer-events:none;
}
.hero>div{min-width:0;position:relative;z-index:1}
.ring{position:relative;width:112px;height:112px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.18)}
.ring .pg{fill:none;stroke:#FFFFFF;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:1.6rem;letter-spacing:-.03em}
.hero .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;opacity:.82}
.hero h2{font-size:1.46rem;font-weight:800;margin:5px 0 14px;color:#FFFFFF;line-height:1.22}
.hero .hm{display:flex;gap:8px;flex-wrap:wrap}
.hero .hm span{
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.22);
  border-radius:99px;padding:4px 13px;font-size:.8rem;font-weight:600;
}

/* KPI Strip (Bento Tiles) */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;border:0;background:none;overflow:visible}
.strip>div,.strip>div:last-child{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-xs);
  padding:15px 16px;
  min-width:0;
  position:relative;overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease;
}
.strip>div:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.strip>div::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:.75;
}
.strip b{display:block;font-family:var(--f-head);font-weight:800;font-size:1.58rem;line-height:1.12;letter-spacing:-.03em}
.strip span{display:block;margin-top:4px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Inputs & Controls */
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],select,textarea{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 12px;min-height:42px;width:100%;min-width:0;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
input:focus,select:focus,textarea:focus{
  outline:none;background:var(--surface);
  border-color:var(--accent);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 18%,transparent);
}
textarea{min-height:80px;resize:vertical}
input.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.secbox{
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  background:var(--surface-2);
  display:flex;flex-direction:column;gap:11px;
}
.secbox .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
details>summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);padding:4px 0;user-select:none}
details>summary:hover{color:var(--ink)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;gap:7px 9px;align-items:center;margin-top:8px}
.tgrid input{min-height:36px;padding:4px 8px;text-align:center;font-family:var(--f-num)}
.tgrid .h{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.tgrid .h:first-child{text-align:left}

/* Floating Live Score Pill */
.live{
  position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);
  border-radius:16px;padding:12px 18px;
  display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;z-index:5;
  box-shadow:0 18px 36px -10px rgba(15,23,42,.45);
}

/* Lists & Progress Bars */
.list{display:flex;flex-direction:column}
.item{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:13px 4px;border-top:1px solid var(--line);flex-wrap:wrap;
  transition:background .14s ease;
}
.item:first-child{border-top:0;padding-top:4px}
.item:last-child{padding-bottom:4px}
.item .t{min-width:0;flex:1 1 210px}
.item .t a{text-decoration:none;color:var(--ink)}
.item .t a:hover{color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:12px}
.bw{display:grid;grid-template-columns:minmax(95px,155px) minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:.89rem;font-weight:500}
.track{height:10px;background:var(--soft);border-radius:99px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.fill.good{background:linear-gradient(90deg,#10B981,#059669)}
.fill.warn{background:linear-gradient(90deg,#F59E0B,#D97706)}
.fill.bad{background:linear-gradient(90deg,#F43F5E,#E11D48)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .55s cubic-bezier(.2,.8,.2,1)}}

/* Challenge Cards & Presets */
.chal-card{
  border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),color-mix(in srgb,var(--accent-2) 4%,var(--surface)));
  border-radius:var(--r-md);padding:16px;
  display:flex;flex-direction:column;gap:10px;
}
.chal-card.done{
  border-color:var(--good-border);
  background:linear-gradient(135deg,var(--good-bg),var(--surface));
}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.preset-btn{
  text-align:left;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface-2);
  cursor:pointer;display:flex;flex-direction:column;gap:3px;
  transition:all .15s ease;
}
.preset-btn:hover{border-color:var(--accent);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow-xs)}

/* 14-Day Streak Heatmap */
.streak-grid{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px}
.sday{
  aspect-ratio:1;border-radius:7px;background:var(--soft);border:1px solid var(--line);
  display:grid;place-items:center;font-size:.66rem;font-weight:700;color:var(--muted);
}
.sday.hit{background:linear-gradient(135deg,var(--good),#10B981);color:#fff;border-color:transparent}
.sday.tod{box-shadow:0 0 0 2px var(--accent)}

/* Flashcard Quiz Card */
.flashcard{
  border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  background:var(--surface-2);border-radius:var(--r-lg);padding:22px;
  display:flex;flex-direction:column;gap:14px;
}
.flash-q{font-size:1.06rem;font-weight:600;line-height:1.5}
.flash-ans{
  padding:14px;border-radius:12px;background:var(--good-bg);border:1px solid var(--good-border);
  color:var(--ink);
}

/* Filter Chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--surface);
  border-radius:99px;padding:6px 13px;font-size:.82rem;font-weight:600;cursor:pointer;
  transition:all .15s ease;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:var(--on-accent);
  box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 55%,transparent);
}

/* Callout Insights & Checklists */
.ins{
  display:flex;gap:11px;align-items:flex-start;
  padding:12px 14px;border-radius:12px;
  background:var(--soft);border:1px solid var(--line);font-size:.92rem;
}
.ins.good{background:var(--good-bg);border-color:var(--good-border)}
.ins.warn{background:var(--warn-bg);border-color:var(--warn-border)}
.ins.bad{background:var(--bad-bg);border-color:var(--bad-border)}

.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--accent);cursor:pointer}
.chk.done span{text-decoration:line-through;color:var(--muted)}

/* Tables */
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
td.r,th.r{text-align:right}

.banner{
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--warn-bg);border:1px solid var(--warn-border);
  color:var(--ink);border-radius:var(--r-md);padding:12px 16px;font-size:.9rem;
}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-md);background:var(--surface-2)}

/* Interactive SVG Chart */
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
svg.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}

svg.chart .ar{opacity:.95}

svg.chart .pt:hover,svg.chart .pt.sel{r:6.5;fill:var(--accent)}
svg.chart .pt.last{fill:var(--accent)}
svg.chart .tg{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
svg.chart text.tgl{fill:var(--warn);font-weight:600}
svg.chart text.lv{fill:var(--ink);font-weight:700}
.chart-tip{
  font-size:.84rem;color:var(--muted);padding:8px 12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}

.toggle-row{
  display:flex;align-items:center;gap:11px;padding:11px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface-2);
  cursor:pointer;font-weight:600;transition:border-color .15s ease;
}
.toggle-row:hover{border-color:var(--accent)}
.toggle-row input{width:18px;height:18px;accent-color:var(--accent)}

.autofill-box{
  border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,var(--surface)),color-mix(in srgb,var(--accent-2) 4%,var(--surface)));
  border-radius:var(--r-md);padding:14px;
}
.autofill-box summary{color:var(--accent);font-weight:700}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:.86rem;font-weight:600;
  z-index:30;max-width:90vw;text-align:center;
  box-shadow:0 12px 28px -6px rgba(15,23,42,.45);
}
#toast[hidden]{display:none!important}

.aitext p{margin:0 0 8px}.aitext ul{margin:0 0 8px;padding-left:20px}.aitext li{margin-bottom:5px}
.aibox{border-top:1px dashed var(--line);padding-top:10px;margin-top:8px}
ol.steps{margin:0;padding-left:20px}

@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.04s}
  .enter>*:nth-child(3){animation-delay:.08s}
  .enter>*:nth-child(4){animation-delay:.12s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (min-width:861px){.top h1{display:none}}

/* Mobile Responsive & Floating Glass Dock */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:14px 14px 132px;gap:16px}
  .top{padding-inline:14px}
  .bar{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;
    position:fixed;
    left:max(8px,env(safe-area-inset-left,0px));
    right:max(8px,env(safe-area-inset-right,0px));
    bottom:calc(8px + env(safe-area-inset-bottom,0px));
    padding:6px 4px 7px;
    border:1px solid var(--line);border-radius:22px;
    background:var(--glass);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 16px 36px -10px rgba(15,23,42,.35);
    z-index:20;overflow:visible;
  }
  .bar a{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
    font-size:.63rem;font-weight:700;color:var(--muted);text-decoration:none;
    padding:5px 2px;border-radius:14px;min-width:0;white-space:nowrap;
  }
  .bar a svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bar a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .bar a.add{color:var(--accent);background:none;position:relative;padding-top:0}
  .bar a.add.on{color:var(--accent);background:none}
  .bar a.add span{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-radius:99px;width:42px;height:42px;display:grid;place-items:center;
    margin-top:-22px;margin-bottom:1px;border:3px solid var(--surface);
    box-shadow:var(--shadow-glow);transition:transform .16s ease;
  }
  .bar a.add:active span{transform:scale(.93)}
  .bar a.add svg{width:21px;height:21px;stroke:var(--on-accent);stroke-width:2.3}
  .live{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .hero{padding:20px;gap:16px}
  .ring{width:86px;height:86px}.ring b{font-size:1.25rem}
  .hero h2{font-size:1.18rem;margin-bottom:10px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bw{grid-template-columns:92px minmax(0,1fr) 50px}
}

/* Print / PDF Export Styling */
@media print{
  body{background:#fff!important;color:#000!important}
  .side,.top,.bar,.btn,.chips,.autofill-box,.aibox,.banner,.no-print{display:none!important}
  .shell{display:block}
  .main{max-width:100%;padding:0}
  .sec{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid;margin-bottom:14px}
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- calculations ---------- */
function secCalc(sec,d){
  d=d||{};var c=+d.c||0,w=+d.w||0,t=+d.t||0,att=c+w;

function testCalc(t){
  var ex=getExam(t.exam);if(!ex)return null;
  var secs=ex.secs.map(function(s){var c=secCalc(s,t.secs[s.k]);c.s=s;return c;});
  var meritSecs=secs.filter(function(x){return !x.s.qual;});
  var qualSecs=secs.filter(function(x){return x.s.qual;});

    var activeSecs=secs.filter(function(x){return x.att>0||x.t>0;});

function sortedTests(f){
  return state.tests.map(function(t,idx){return {t:t,idx:idx};})
    .filter(function(o){return getExam(o.t.exam)&&(!f||f(o.t));})
    .sort(function(a,b){

      return a.idx-b.idx;

  var list=sortedTests(function(x){return x.exam===t.exam&&!x.sectional;});
  var i=list.findIndex(function(x){return x.id===t.id;});
  return i>0?list[i-1]:null;
}
function tkey(subj,name){return subj+':'+name;}

function rank(){
  var a={};Object.keys(TOP).forEach(function(sj){TOP[sj].forEach(function(t){var k=tkey(sj,t[0]);a[k]={key:k,subj:sj,name:t[0],wt:t[1],rc:0,rw:0,wc:0,ww:0,last:''};});});
  var withT=sortedTests().filter(function(t){return t.topics&&Object.keys(t.topics).length;}).reverse();
  withT.forEach(function(t,i){var f=Math.pow(.85,i);Object.keys(t.topics).forEach(function(k){var o=a[k];if(!o)return;var c=t.topics[k].c|0,w=t.topics[k].w|0;o.rc+=c;o.rw+=w;o.wc+=f*c;o.ww+=f*w;if(c+w>0&&t.date>o.last)o.last=t.date;});});
  return Object.keys(a).map(function(k){
    var o=a[k],att=o.rc+o.rw,wat=o.wc+o.ww,acc=wat?o.wc/wat:0,sacc=(o.wc+1)/(wat+2);
    o.att=att;o.acc=acc;o.status=att<4?'nodata':acc<.5?'red':acc<.75?'amber':'green';
    o.pri=(1-sacc)*(.5+o.wt/3)*(1+Math.log(1+o.ww));return o;
  });
}

/* ---------- Challenge Progress Helper ---------- */
function chalStats(ch){
  var matched=sortedTests(function(t){
    if(t.date<ch.start||t.date>ch.end)return false;
    if(ch.scope==='full'&&t.sectional)return false;
    if(ch.scope==='sect'&&!t.sectional)return false;
    if(ch.exam&&ch.exam!=='all'&&t.exam!==ch.exam)return false;
    return true;
  });
  var done=matched.length,pct=Math.min(100,Math.round(done/Math.max(1,ch.target)*100));
  var t0=today(),remDays=dayDiff(t0,ch.end)+1;
  var active=t0>=ch.start&&t0<=ch.end;
  var completed=done>=ch.target;
  var expired=t0>ch.end&&!completed;
  var remMocks=Math.max(0,ch.target-done);
  var pace=remDays>0?r1(remMocks/remDays):remMocks;
  return {done:done,pct:pct,remDays:remDays,active:active,completed:completed,expired:expired,remMocks:remMocks,pace:pace,matched:matched};
}

/* ---------- Expected Score Predictor ---------- */
function scorePredictor(examId){
  var ts=sortedTests(function(t){return t.exam===examId&&!t.sectional;}).slice(-5);
  if(ts.length<2)return null;
  var calcs=ts.map(testCalc);
  var scores=calcs.map(function(c){return c.score;});
  var mean=sum(scores,function(x){return x;})/scores.length;
  var variance=sum(scores,function(x){return Math.pow(x-mean,2);})/scores.length;
  var sd=Math.sqrt(variance);
  var max=calcs[calcs.length-1].max;
  var lo=Math.max(0,r1(mean-Math.max(2,sd*0.8)));
  var hi=Math.min(max,r1(mean+Math.max(3,sd*0.9)));
  return {lo:lo,hi:hi,max:max,mean:r1(mean),count:ts.length};
}

function beep(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(function(delay){
      var osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sine';osc.frequency.value=880;
      gain.gain.setValueAtTime(0.18,ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+0.2);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+0.22);
    });
  }catch(e){}
}

function toggleTimer(){
  if(timer.running){
    clearInterval(timer.iv);timer.running=false;
  }else{
    if(timer.rem<=0)timer.rem=timer.total;
    timer.done=false;timer.running=true;
    timer.iv=setInterval(function(){

        clearInterval(timer.iv);beep();toast('⏱️ Time is up!');

}

/* ---------- insights ---------- */
function insights(t,prev){
  var c=testCalc(t),out=[],ex=c.ex,tgt=+state.settings.target||70;
  if(prev&&!t.sectional){
    var pc=testCalc(prev),d=r2(c.score-pc.score);
    out.push({k:d>=0?'good':'warn',t:'Score is '+(d>=0?'up ':'down ')+Math.abs(d)+' marks compared with '+prev.name+' ('+r1(pc.pct)+'% to '+r1(c.pct)+'%).'});
  }
  if(t.cutoff>0&&!t.sectional){
    var cdif=r2(c.score-t.cutoff);
    out.push({k:cdif>=0?'good':'bad',t:cdif>=0?'Cutoff cleared by +'+cdif+' marks (Cutoff: '+t.cutoff+').':'Missed cutoff by '+Math.abs(cdif)+' marks (Cutoff: '+t.cutoff+').'});
  }
  if(t.pctile>0){
    out.push({k:t.pctile>=85?'good':t.pctile>=65?'info':'warn',t:'Percentile recorded: '+t.pctile+'%ile'+(t.pctile>=85?' — Safe selection zone!':' — Aim for 85%+ percentile consistently.')});
  }
  var gap=r1(c.pct-tgt);
  out.push({k:gap>=0?'good':'info',t:gap>=0?'You are '+gap+' points above your target of '+tgt+'%.':'You are '+Math.abs(gap)+' points below your target of '+tgt+'%. About '+Math.ceil(Math.abs(gap)/100*c.max)+' more marks are needed.'});
  if(c.qMax>0){
    var qPass=c.qPct>=30;
    out.push({k:qPass?'good':'bad',t:'Qualifying section (Computer): '+c.qScore+'/'+c.qMax+' ('+r1(c.qPct)+'%) — '+(qPass?'Qualified (>=30%).':'Below 30% qualifying cutoff!')});
  }
  if(c.loss>0){
    var avgM=c.meritSecs.length?sum(c.meritSecs,function(x){return x.s.m;})/c.meritSecs.length:ex.secs[0].m;
    out.push({k:c.loss>=c.max*.06?'warn':'info',t:'Wrong answers cost you '+c.loss+' marks, about '+Math.round(c.loss/avgM)+' correct answers worth.'});
  }
  var ideal=ex.dur/sum(ex.secs,function(s){return s.q;});
  var active=c.secs.filter(function(s){return s.att>0;});
  var best=active.slice().sort(function(a,b){return b.score/b.max-a.score/a.max;});
  if(best.length>1){
    out.push({k:'good',t:'Strongest section: '+best[0].s.n+' ('+r1(best[0].score/best[0].max*100)+'%). Weakest: '+best[best.length-1].s.n+' ('+r1(best[best.length-1].score/best[best.length-1].max*100)+'%).'});
  }
  active.forEach(function(s){
    if(s.att>=5&&s.acc<.65)out.push({k:'bad',t:s.s.n+': accuracy is '+r1(s.acc*100)+'% after attempting '+s.att+'. Skip questions you cannot start within a minute.'});
    else if(s.rate<.7&&s.acc>=.85&&s.att>0)out.push({k:'info',t:s.s.n+': accuracy is '+r1(s.acc*100)+'% but you attempted only '+s.att+' of '+s.s.q+'. You can safely attempt more.'});
    if(s.t>0&&s.tpq>ideal*1.3)out.push({k:'warn',t:s.s.n+': '+r1(s.tpq)+' min per attempted question against about '+r1(ideal)+' min available on average.'});
  });
  var mm=t.mistakes||{},top=Object.keys(MIST).sort(function(a,b){return (mm[b]|0)-(mm[a]|0);})[0];
  if(top&&(mm[top]|0)>0)out.push({k:'info',t:MIST_TIP[top]});
  var negRules={};
  ex.secs.forEach(function(s){
    if(s.neg>0){
      var key=s.m+':'+r2(s.neg);
      if(!negRules[key])negRules[key]={m:s.m,neg:s.neg,names:[]};
      negRules[key].names.push(s.n);
    }
  });
  Object.keys(negRules).forEach(function(k){
    var nr=negRules[k],be=r1(nr.neg/(nr.m+nr.neg)*100);
    out.push({k:'info',t:'Break-even guess rate ('+nr.names.join(', ')+'): '+be+'% (+'+nr.m+' / -'+r2(nr.neg)+'). Guess only after eliminating at least one option.'});
  });
  return out;
}

function lineChart(pts,target){
  if(!pts.length)return '<div class="empty">Log a full mock to see your score trend.</div>';
  var W=640,H=230,L=40,R=22,T=16,B=34,vals=pts.map(function(p){return p.v;}).concat([target]);
  var lo=Math.max(0,Math.floor((Math.min.apply(null,vals)-8)/10)*10),hi=Math.min(100,Math.ceil((Math.max.apply(null,vals)+5)/10)*10);
  if(hi-lo<20){hi=Math.min(100,lo+20);lo=hi-20;}
  var x=function(i){return pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);},y=function(v){v=Math.max(lo,Math.min(hi,v));return T+(hi-v)/(hi-lo)*(H-T-B);};
  var gid='cg-'+Math.random().toString(36).slice(2,6);
  var defs='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0.0"/></linearGradient></defs>';
  var g='',v;for(v=lo;v<=hi;v+=10)g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  var d=pts.map(function(p,i){return (i?'L':'M')+x(i)+' '+y(p.v);}).join(' ');
  var area=pts.length>1?'<path class="ar" style="fill:url(#'+gid+')" d="'+d+' L'+x(pts.length-1)+' '+(H-B)+' L'+x(0)+' '+(H-B)+'Z"/>':'';
  var step=Math.ceil(pts.length/7),lab='',dots='';
  var selIdx=state.ui.chartPt!=null&&state.ui.chartPt<pts.length?state.ui.chartPt:pts.length-1;
  pts.forEach(function(p,i){

    dots+='<circle class="pt'+(last?' last':'')+(isSel?' sel':'')+'" data-act="chartPt" data-idx="'+i+'" cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(isSel?6:4)+'"><title>'+esc(p.name)+' ('+esc(p.l)+'): '+p.score+'/'+p.max+' ('+r1(p.v)+'%)</title></circle>';

   '<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(target)+'" y2="'+y(target)+'"/><text class="tgl" x="'+(W-R)+'" y="'+(y(target)-5)+'" text-anchor="end">target '+target+'%</text>'+
   area+(pts.length>1?'<path class="ln" d="'+d+'"/>':'')+dots+lab+'<text class="lv" x="'+Math.min(Math.max(x(selIdx),L+20),W-R-20)+'" y="'+(y(sp.v)-10)+'" text-anchor="middle">'+r1(sp.v)+'%</text></svg>'+
   '<div class="chart-tip"><span><b>Selected:</b> <a href="#test-'+esc(sp.id)+'">'+esc(sp.name)+'</a> ('+esc(sp.l)+')</span><span class="num"><b>'+sp.score+'</b>/'+sp.max+' ('+r1(sp.v)+'%) · Tap any dot to inspect</span></div>';

  var due=dueRevs().slice(0,4);

}

function vWeak(){
  var f=state.ui.weakF||'all',r=rank(),subs=Object.keys(TOP);
  var chips='<div class="chips"><button class="chip'+(f==='all'?' on':'')+'" data-act="weakF" data-f="all">All</button>'+subs.map(function(sj){return '<button class="chip'+(f===sj?' on':'')+'" data-act="weakF" data-f="'+sj+'">'+SUBJ[sj]+'</button>';}).join('')+'</div>';
  var list=r.filter(function(t){return f==='all'||t.subj===f;});
  var tested=list.filter(function(t){return t.status!=='nodata';}).sort(function(a,b){return b.pri-a.pri;}),untested=list.filter(function(t){return t.status==='nodata';}).sort(function(a,b){return b.wt-a.wt;});
  var cnt={red:0,amber:0,green:0};r.forEach(function(t){if(cnt[t.status]!=null)cnt[t.status]++;});
  var lab={red:'Weak',amber:'Improve',green:'Strong'},cls={red:'bad',amber:'warn',green:'good'};
  var rows=tested.map(function(t){
    var rv=state.rev[t.key];
    return '<div class="item"><div class="t"><b>'+esc(t.name)+'</b> <span class="pill '+cls[t.status]+'">'+lab[t.status]+'</span><div class="muted small">'+SUBJ[t.subj]+' · weight '+'●'.repeat(t.wt)+'○'.repeat(3-t.wt)+' · '+t.att+' questions · '+t.rw+' wrong'+(rv?' · revised '+rv.n+'x, last '+fmtD(rv.last):'')+'</div><div class="track" style="margin-top:6px"><div class="fill '+cls[t.status]+'" style="width:'+Math.round(t.acc*100)+'%"></div></div></div><div class="row"><span class="num"><b>'+r1(t.acc*100)+'%</b></span><button class="btn sm" data-act="revise" data-k="'+esc(t.key)+'">Mark revised</button></div></div>';
  }).join('');
  var un=untested.length?'<details><summary>Not tested yet ('+untested.length+')</summary><div class="list">'+untested.map(function(t){return '<div class="item"><div class="t">'+esc(t.name)+' <span class="muted small">'+SUBJ[t.subj]+' · weight '+'●'.repeat(t.wt)+'○'.repeat(3-t.wt)+'</span></div></div>';}).join('')+'</div></details>':'';
  return sampleBanner()+'<section class="sec"><header><h2>Weak topics</h2><div class="row"><span class="pill bad">'+cnt.red+' weak</span><span class="pill warn">'+cnt.amber+' improve</span><span class="pill good">'+cnt.green+' strong</span></div></header><div class="muted small">Ranked by accuracy, how often the topic appears in papers, and how many marks you lost. Recent mocks count more than old ones.</div>'+chips+(rows?'<div class="list">'+rows+'</div>':'<div class="empty">No topic-wise results in this filter yet.</div>')+un+'</section>';
}

function readLog(){
  var exId=document.getElementById('f-exam').value,ex=getExam(exId);
  var editId=document.getElementById('f-edit-id')?document.getElementById('f-edit-id').value:'';
  var t={
    id:editId||uid(),
    date:document.getElementById('f-date').value||today(),
    exam:exId,
    name:document.getElementById('f-name').value.trim()||'Mock',
    source:document.getElementById('f-src').value.trim(),
    diff:document.getElementById('f-diff').value||'moderate',
    pctile:parseFloat(document.getElementById('f-pctile').value)||0,
    cutoff:parseFloat(document.getElementById('f-cutoff').value)||0,
    sectional:!!(document.getElementById('f-sect')&&document.getElementById('f-sect').checked),
    secs:{},topics:{},mistakes:{},
    notes:document.getElementById('f-notes').value.trim()
  };
  var n=function(id){var el=document.getElementById(id);return el?Math.max(0,parseInt(el.value,10)||0):0;};
  ex.secs.forEach(function(s){t.secs[s.k]={c:n('s-'+s.k+'-c'),w:n('s-'+s.k+'-w'),t:n('s-'+s.k+'-t')};});
  Array.prototype.forEach.call(document.querySelectorAll('#logform [data-key]'),function(el){
    var v=Math.max(0,parseInt(el.value,10)||0);if(!v)return;
    var k=el.getAttribute('data-key');
    (t.topics[k]||(t.topics[k]={c:0,w:0}))[el.getAttribute('data-f')]+=v;
  });
  Object.keys(MIST).forEach(function(k){t.mistakes[k]=n('m-'+k);});
  return {t:t,ex:ex,editId:editId};
}
function liveLog(){
  if(!document.getElementById('logform'))return;
  var r=readLog(),c=testCalc(r.t),bad=false,totalTime=0;
  r.ex.secs.forEach(function(s,i){
    var d=c.secs[i],el=document.getElementById('sl-'+s.k);
    totalTime+=d.t;
    var over=d.att>s.q;
    var topC=0,topW=0;
    Array.prototype.forEach.call(document.querySelectorAll('#logform [data-sk="'+s.k+'"]'),function(inp){
      var v=Math.max(0,parseInt(inp.value,10)||0);
      if(inp.dataset.f==='c')topC+=v;else topW+=v;
      inp.classList.remove('bad');
    });
    var topMismatch=(topC>d.c)||(topW>d.w);
    if(over||topMismatch)bad=true;
    if(topMismatch){
      Array.prototype.forEach.call(document.querySelectorAll('#logform [data-sk="'+s.k+'"]'),function(inp){
        var v=Math.max(0,parseInt(inp.value,10)||0);
        if(v>0&&((inp.dataset.f==='c'&&topC>d.c)||(inp.dataset.f==='w'&&topW>d.w)))inp.classList.add('bad');
      });
    }
    ['c','w'].forEach(function(f){var inp=document.getElementById('s-'+s.k+'-'+f);if(inp)inp.className=(over||topMismatch)?'bad':'';});
    if(el){
      if(over)el.innerHTML='<span style="color:var(--bad);font-weight:600">Right + wrong exceeds '+s.q+' questions.</span>';
      else if(topMismatch)el.innerHTML='<span style="color:var(--bad);font-weight:600">Topic sum ('+topC+'R/'+topW+'W) exceeds section ('+d.c+'R/'+d.w+'W).</span>';
      else el.textContent=d.att?'Left blank '+d.un+' · Section score '+d.score+' of '+d.max+(d.att?' · Accuracy '+r1(d.acc*100)+'%':''):'';
    }
  });
  var timeWarn=totalTime>r.ex.dur?' · ⚠️ Time '+totalTime+'m > '+r.ex.dur+'m':'';
  document.getElementById('liveTxt').textContent='Score '+c.score+' / '+c.max+' ('+r1(c.pct)+'%) · '+c.att+' attempted'+timeWarn;
  liveLog.bad=bad;
}

/* ---------- plan generation ---------- */
function genPlan(N,H){
  var s=state.settings,ex=getExam(s.exam)||EXAMS.cgl1,r=rank(),pool=r.filter(function(t){return t.status==='red'||t.status==='amber';}).sort(function(a,b){return b.pri-a.pri;}),note='';
  if(!sortedTests(function(t){return t.exam===s.exam;}).length)return {err:'Add at least one mock test for '+ex.name+' first. The plan is built from your results.'};
  if(!pool.length){
    var ss=subjStats(s.exam).slice(0,2).map(function(x){return x.subj;});
    ss.forEach(function(sj){pool=pool.concat(r.filter(function(t){return t.subj===sj&&t.wt===3&&t.status!=='green';}));});
    note='No topic-wise results yet, so this plan uses the high-weight topics of your two weakest subjects in '+ex.name+'.';
  }
  if(!pool.length)return {err:'Every tracked topic is strong. Keep taking mocks and add topic results to refresh this.'};
  pool=pool.slice(0,Math.max(6,Math.min(pool.length,N*2)));
  if(!note)note=pool.length+' topics chosen from your latest results. Weakest topics repeat more often.';
  var reds=pool.filter(function(t){return t.status==='red';}),seq=pool.concat(reds,pool.slice(0,Math.ceil(pool.length/2)),reds);
  var start=today(),M=H*60,first={},p=0,days=[],pe=pendingErrors().length>0,ws=subjStats(s.exam)[0],wsName=ws?SUBJ_FULL[ws.subj]:'your weakest section';
  for(var d=0;d<N;d++){
    var date=addDays(start,d),tasks=[],id=0,used=0,full=(d===N-1)||((d+1)%14===0),sect=!full&&(d+1)%7===0;
    var mk=function(txt,min,topic){tasks.push({id:'d'+d+'-'+(id++),txt:txt,min:min,done:false,topic:topic||''});used+=min;};
    var rec=0;Object.keys(first).forEach(function(k){if(rec<2&&INT.indexOf(d-first[k].d)>=0){mk('Recall ['+SUBJ[tsubj(k)]+'] '+tname(k)+': redo 10 questions from your mistakes and notes',20,k);rec++;}});
    if(full){mk('Full mock for '+ex.name+' ('+ex.dur+' min), then add it under Add test',ex.dur,'');mk('Analyse the mock: update weak topics and log mistakes',30,'');}
    else if(sect){mk('Sectional test on '+wsName+' (timed)',30,'');mk('Review every wrong answer from the sectional',20,'');}
    if(pe&&!full){mk('Mistake notebook: review pending questions',20,'');}
    var slots=Math.max(1,Math.floor((M-used)/45));if(full)slots=Math.min(slots,1);
    for(var i=0;i<slots;i++){
      var t=null,tries=0;
      while(tries<seq.length){var c=seq[p++%seq.length];tries++;if(!tasks.some(function(x){return x.topic===c.key;})){t=c;break;}}
      if(!t)break;
      if(!first[t.key]){first[t.key]={d:d};mk('Learn ['+SUBJ[t.subj]+'] '+t.name+': concept notes and 10 solved examples',45,t.key);}
      else mk('Practice ['+SUBJ[t.subj]+'] '+t.name+': 25 timed questions',45,t.key);
    }
    days.push({date:date,tasks:tasks});
  }
  return {plan:{created:start,n:N,hours:H,note:note,days:days}};
}

function exportJson(){var c=JSON.parse(JSON.stringify(state));c.settings.ai.key='';c.ui={};return JSON.stringify(c);}
function mdLite(t){
  var h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'),out='',ul=false;
  h.split('\n').forEach(function(l){
    var m=l.match(/^\s*[-*•]\s+(.*)/);
    if(m){if(!ul){out+='<ul>';ul=true;}out+='<li>'+m[1]+'</li>';}
    else{if(ul){out+='</ul>';ul=false;}if(l.trim())out+='<p>'+l+'</p>';}
  });
  return out+(ul?'</ul>':'');
}

function testData(t){
  var c=testCalc(t),s=state.settings,L=[c.ex.name+': score '+c.score+' of '+c.max+' ('+r1(c.pct)+'%), target '+(+s.target||70)+'%, negative marks lost '+c.loss+'.'];
  if(t.pctile>0)L.push('Percentile: '+t.pctile+'%.');
  if(t.cutoff>0)L.push('Cutoff: '+t.cutoff+'.');
  if(s.examDate){var dd=dayDiff(today(),s.examDate);if(dd>=0)L.push('Exam is in '+dd+' days. Study hours per day: '+s.hours+'.');}
  c.secs.forEach(function(x){L.push(x.s.n+': '+x.c+' right, '+x.w+' wrong, '+x.un+' blank of '+x.s.q+', accuracy '+r1(x.acc*100)+'%'+(x.t?', '+x.t+' min':'')+'.');});
  var m=t.mistakes||{};L.push('Mistake causes: '+Object.keys(MIST).map(function(k){return MIST[k]+' '+(m[k]|0);}).join(', ')+'.');
  var wk=rank().filter(function(x){return x.status==='red'||x.status==='amber';}).sort(function(a,b){return b.pri-a.pri;}).slice(0,6);
  if(wk.length)L.push('Weakest topics overall: '+wk.map(function(x){return x.name+' '+r1(x.acc*100)+'%';}).join(', ')+'.');
  return L.join('\n')+'\n\nGive: 1) the two biggest reasons marks were lost, 2) what to do in the next 3 days, 3) one exam-time strategy change.';
}
function errData(e){return 'Topic: '+SUBJ_FULL[tsubj(e.topic)]+' / '+tname(e.topic)+'.\nQuestion note: '+e.q+'\nMy note on the method: '+(e.fix||'none')+'\n\nExplain the correct method step by step, give one shortcut if one exists, then one similar practice question with its answer at the end. If the question note is too vague to solve, say what is missing.';}

function askAI(sys,prompt,imgPart){
  var ai=state.settings.ai;
  if(!ai.key)return Promise.reject(new Error('Add your free Gemini API key in Setup first.'));
  if(navigator.onLine===false)return Promise.reject(new Error('You are offline. AI needs internet; everything else still works.'));
  var parts=[{text:prompt}];
  if(imgPart)parts.push(imgPart);
  var body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:parts}],generationConfig:{temperature:.3,maxOutputTokens:2048}};
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(ai.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':ai.key},body:JSON.stringify(body)})
   .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {r:r,j:j};});},function(){throw new Error('Could not reach Gemini. Check internet connection.');})
   .then(function(x){
     if(!x.r.ok){
       var st=x.r.status,msg=x.j&&x.j.error&&x.j.error.message||'';
       throw new Error(st===429?'Free limit reached. Wait a minute or switch model in Setup.':st===404?'Model name not found. Choose another model in Setup.':(st===400&&/key/i.test(msg))||st===401?'The API key looks invalid. Paste it again in Setup.':st===403?'This key is not allowed here.':'Gemini error '+st+(msg?': '+msg.slice(0,120):''));
     }
     var c=x.j.candidates&&x.j.candidates[0],txt=c&&c.content&&c.content.parts?c.content.parts.map(function(p){return p.text||'';}).join('').trim():'';
     if(!txt)throw new Error('Gemini returned no text. Try again.');
     return txt;
   });
}

var pendingImg=null;
function parseScoreWithAI(){
  var exId=document.getElementById('f-exam').value,ex=getExam(exId);
  var rawTxt=(document.getElementById('af-text').value||'').trim();
  if(!rawTxt&&!pendingImg){toast('Paste Testbook scorecard/answer key text or upload a screenshot first.');return;}
  var secSchema=ex.secs.map(function(s){return s.k+' ('+s.n+', subject:'+s.subj+', maxQ:'+s.q+')';}).join(', ');
  var topicKeys=[];
  ex.secs.forEach(function(s){TOP[s.subj].forEach(function(tp){topicKeys.push(tkey(s.subj,tp[0]));});});
  var sys='Extract mock test scorecard or answer key numbers into strict JSON only (no markdown backticks). Schema: {"name":"string","source":"Testbook","pctile":0,"cutoff":0,"secs":{"<secKey>":{"c":0,"w":0,"t":0}},"topics":{"<subj:TopicName>":{"c":0,"w":0}}}. Available section keys: '+secSchema+'. Valid topic keys: '+topicKeys.join(', ')+'. Only include fields explicitly found in the input.';
  state.ui.busy='parse';render();
  askAI(sys,'Extract scorecard/answer-key data from this test result:\n'+rawTxt,pendingImg).then(function(out){
    state.ui.busy='';render();
    try{
      var clean=out.replace(/```json|```/gi,'').trim();
      var data=JSON.parse(clean);
      if(data.name&&document.getElementById('f-name'))document.getElementById('f-name').value=data.name;
      if(data.source&&document.getElementById('f-src')&&!document.getElementById('f-src').value)document.getElementById('f-src').value=data.source;
      if(data.pctile&&document.getElementById('f-pctile'))document.getElementById('f-pctile').value=data.pctile;
      if(data.cutoff&&document.getElementById('f-cutoff'))document.getElementById('f-cutoff').value=data.cutoff;
      if(data.secs){
        Object.keys(data.secs).forEach(function(sk){
          var sv=data.secs[sk]||{};
          if(document.getElementById('s-'+sk+'-c')&&sv.c!=null)document.getElementById('s-'+sk+'-c').value=sv.c;
          if(document.getElementById('s-'+sk+'-w')&&sv.w!=null)document.getElementById('s-'+sk+'-w').value=sv.w;
          if(document.getElementById('s-'+sk+'-t')&&sv.t!=null)document.getElementById('s-'+sk+'-t').value=Math.round(sv.t);
        });
      }
      if(data.topics){
        Object.keys(data.topics).forEach(function(tk){
          var tv=data.topics[tk]||{};
          var cInp=document.querySelector('#logform [data-key="'+tk+'"][data-f="c"]');
          var wInp=document.querySelector('#logform [data-key="'+tk+'"][data-f="w"]');
          if(cInp&&tv.c!=null)cInp.value=tv.c;
          if(wInp&&tv.w!=null)wInp.value=tv.w;
        });
      }
      liveLog();
      toast('Scorecard auto-filled! Please verify numbers and tap Save.');
    }catch(e){
      toast('Could not parse AI output. Check scorecard text and try again.');
    }
  },function(err){
    state.ui.busy='';render();toast(err.message);
  });
}

function runAI(busyKey,sys,prompt,store){
  state.ui.busy=busyKey;state.ui.aiErr=null;render();
  askAI(sys,prompt).then(function(txt){store(txt);state.ui.busy='';save();render();},function(err){state.ui.busy='';state.ui.aiErr={k:busyKey,m:err.message};save();render();});
}

/* ---------- actions ---------- */
function dl(json){try{var b=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mock-lens-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}}
function importJson(txt){
  var o;try{o=JSON.parse(txt);}catch(e){toast('That is not valid backup text.');return;}
  if(!o||!Array.isArray(o.tests)||!o.settings){toast('This does not look like a Mock Lens backup.');return;}
  var keep=state.settings.ai.key;state=fix(o);state.settings.ai.key=keep;save();applyTheme();render();toast('Backup restored: '+state.tests.length+' tests.');
}
function act(a,d,el){
  var s=state.settings;
  if(a==='saveTest'){
    var r=readLog();liveLog();
    if(liveLog.bad){toast('Fix the highlighted sections first.');return;}
    var c=testCalc(r.t);
    if(!c.att){toast('Enter correct and wrong answers for at least one section.');return;}
    if(r.editId){
      var idx=state.tests.findIndex(function(x){return x.id===r.editId;});
      if(idx>=0){
        r.t.ai=state.tests[idx].ai;
        state.tests[idx]=r.t;
      }else state.tests.push(r.t);
      toast('Test updated.');
    }else{
      state.tests.push(r.t);
      toast('Test saved.');
    }
    logActivity();
    state.ui.logExam=null;pendingImg=null;save();location.hash='#test-'+r.t.id;
  }
  else if(a==='aiParseScore'){parseScoreWithAI();}
  else if(a==='chartPt'){state.ui.chartPt=parseInt(d.idx,10);render();}
  else if(a==='toggleSide'){s.sideCollapsed=!s.sideCollapsed;save();var sh=document.getElementById('shell');if(sh)sh.classList.toggle('collapsed',!!s.sideCollapsed);}
  else if(a==='timerToggle'){toggleTimer();}
  else if(a==='timerSet'){setTimerMin(parseInt(d.m,10)||15);}
  else if(a==='presetChal'){
    var presets=[
      {title:'Weekly Target: 10 Mocks',days:7,target:10,scope:'all'},
      {title:'7-Day Full Mock Sprint',days:7,target:5,scope:'full'},
      {title:'14-Day Consistency Marathon',days:14,target:12,scope:'all'},
      {title:'30-Day Exam Readiness',days:30,target:25,scope:'full'}
    ];
    var p=presets[parseInt(d.idx,10)||0];
    if(document.getElementById('ch-title'))document.getElementById('ch-title').value=p.title;
    if(document.getElementById('ch-target'))document.getElementById('ch-target').value=p.target;
    if(document.getElementById('ch-days'))document.getElementById('ch-days').value=p.days;
    if(document.getElementById('ch-scope'))document.getElementById('ch-scope').value=p.scope;
    toast('Preset loaded — tap Start Challenge!');
  }
  else if(a==='addChal'){
    var title=(document.getElementById('ch-title').value||'').trim()||'Mock Challenge';
    var target=Math.max(1,parseInt(document.getElementById('ch-target').value,10)||10);
    var days=Math.max(1,parseInt(document.getElementById('ch-days').value,10)||7);
    var scope=document.getElementById('ch-scope').value||'all';
    var exam=document.getElementById('ch-exam').value||'all';
    var stDate=today(),enDate=addDays(stDate,days-1);
    state.challenges.push({id:uid(),title:title,start:stDate,end:enDate,target:target,scope:scope,exam:exam});
    logActivity();save();render();toast('🏆 Challenge started! Go crush it!');
  }
  else if(a==='delChal'){state.challenges=state.challenges.filter(function(c){return c.id!==d.id;});save();render();toast('Challenge removed.');}
  else if(a==='delTest'){if(state.ui.confirm===d.id){state.tests=state.tests.filter(function(t){return t.id!==d.id;});state.ui.confirm=null;save();toast('Test deleted.');}else state.ui.confirm=d.id;render();}
  else if(a==='clearSample'){state.tests=state.tests.filter(function(t){return !t.sample;});state.errors=state.errors.filter(function(e){return !e.sample;});state.challenges=state.challenges.filter(function(c){return !c.sample;});save();render();toast('Examples cleared.');}
  else if(a==='weakF'){state.ui.weakF=d.f;render();}
  else if(a==='errF'){state.ui.errF=d.f;render();}
  else if(a==='errSubj'){state.ui.errSubj=d.f;render();}
  else if(a==='toggleQuiz'){state.ui.quizMode=!state.ui.quizMode;state.ui.quizRev=false;render();}
  else if(a==='quizReveal'){state.ui.quizRev=true;render();}
  else if(a==='quizPass'){
    state.errors.forEach(function(e){
      if(e.id===d.id){
        e.streak=(e.streak||0)+1;
        if(e.streak>=2){e.mastered=true;toast('🎉 2/2 streak! Marked as Mastered.');}
        else toast('Nice! 1/2 streak — one more correct re-attempt to master.');
      }
    });
    state.ui.quizRev=false;state.ui.quizIdx=(state.ui.quizIdx||0)+1;logActivity();save();render();
  }
  else if(a==='quizFail'){
    state.errors.forEach(function(e){if(e.id===d.id)e.streak=0;});
    state.ui.quizRev=false;state.ui.quizIdx=(state.ui.quizIdx||0)+1;logActivity();save();render();toast('Streak reset — keep it in review!');
  }
  else if(a==='revise'){var v=state.rev[d.k]||{n:0,last:''};v.n++;v.last=today();state.rev[d.k]=v;logActivity();save();render();toast('Next recall in '+INT[Math.min(v.n-1,INT.length-1)]+' day(s).');}
  else if(a==='genPlan'){var N=parseInt(document.getElementById('p-days').value,10)||14,H=parseFloat(document.getElementById('p-hours').value)||3;s.hours=H;var g=genPlan(N,H);if(g.err){state.ui.planMsg=g.err;}else{state.ui.planMsg='';state.plan=g.plan;}logActivity();save();render();}
  else if(a==='shiftMissed'){
    if(!state.plan)return;
    var t0=today(),moved=[];
    state.plan.days.forEach(function(day){
      if(day.date<t0){
        var rem=[];
        day.tasks.forEach(function(tk){if(!tk.done)moved.push(tk);else rem.push(tk);});
        day.tasks=rem;
      }
    });
    if(!moved.length){toast('No missed tasks to shift.');return;}
    var tDay=state.plan.days.filter(function(day){return day.date===t0;})[0];
    if(!tDay){tDay={date:t0,tasks:[]};state.plan.days.unshift(tDay);}
    tDay.tasks=tDay.tasks.concat(moved);
    save();render();toast('Shifted '+moved.length+' missed task(s) to today.');
  }
  else if(a==='addErr'){
    var q=document.getElementById('e-q').value.trim();if(!q){toast('Describe the question first.');return;}
    state.errors.push({id:uid(),date:today(),topic:document.getElementById('e-topic').value,q:q,why:document.getElementById('e-why').value,fix:document.getElementById('e-fix').value.trim(),streak:0,mastered:false});
    logActivity();save();render();toast('Mistake saved.');
  }
  else if(a==='mast'){state.errors.forEach(function(e){if(e.id===d.id)e.mastered=!e.mastered;});logActivity();save();render();}
  else if(a==='delErr'){state.errors=state.errors.filter(function(e){return e.id!==d.id;});save();render();}
  else if(a==='theme'){s.theme=d.v;save();applyTheme();render();}
  else if(a==='export'){s.lastExport=today();save();var j=exportJson();dl(j);var ta=document.getElementById('b-text');if(ta)ta.value=j;toast('Backup downloaded.');}
  else if(a==='copyBackup'){
    var j2=exportJson(),ta2=document.getElementById('b-text');if(ta2)ta2.value=j2;s.lastExport=today();save();
    var fb=function(){if(ta2){ta2.focus();ta2.select();}toast('Select and copy the text in the box.');};
    try{navigator.clipboard.writeText(j2).then(function(){toast('Backup copied.');},fb);}catch(e){fb();}
  }
  else if(a==='importText'){var tx=document.getElementById('b-text').value.trim();if(!tx){toast('Paste the backup text first.');return;}importJson(tx);}
  else if(a==='addCustom'){
    var nm=document.getElementById('x-name').value.trim(),secs=[];
    [1,2,3,4].forEach(function(i){var sj=document.getElementById('x-s'+i).value,q=parseInt(document.getElementById('x-q'+i).value,10);if(sj&&q>0)secs.push(S('c'+i,SUBJ_FULL[sj],sj,q,parseFloat(document.getElementById('x-m'+i).value)||1,Math.abs(parseFloat(document.getElementById('x-n'+i).value)||0)));});
    if(!nm||!secs.length){toast('Add a name and at least one section.');return;}
    s.custom.push({id:'x'+uid(),name:nm,fam:document.getElementById('x-fam').value,dur:parseInt(document.getElementById('x-dur').value,10)||60,ok:0,secs:secs});save();render();toast('Exam added.');
  }
  else if(a==='delCustom'){var used=state.tests.some(function(t){return t.exam===d.id;});if(used){toast('Delete the tests for this exam first.');return;}s.custom=s.custom.filter(function(c){return c.id!==d.id;});if(s.exam===d.id)s.exam='cgl1';save();render();}
  else if(a==='aiTest'){var tt=state.tests.filter(function(x){return x.id===d.id;})[0];if(tt)runAI('t'+d.id,aiSys(),testData(tt),function(x){tt.ai={text:x,at:today(),model:s.ai.model};});}
  else if(a==='aiErr'){var ee=state.errors.filter(function(x){return x.id===d.id;})[0];if(ee)runAI('e'+d.id,aiSys(),errData(ee),function(x){ee.ai={text:x,at:today(),model:s.ai.model};});}
  else if(a==='aiSave'){
    var kv=document.getElementById('ai-key').value.trim(),sel=document.getElementById('ai-model').value,m2=document.getElementById('ai-model2').value.trim();
    if(kv)s.ai.key=kv;s.ai.model=sel==='other'?(m2||'gemini-2.5-flash'):sel;s.ai.lang=document.getElementById('ai-lang').value;save();render();toast(s.ai.key?'AI settings saved.':'Paste your API key first.');
  }
  else if(a==='aiTestKey'){if(!s.ai.key){toast('Save an API key first.');return;}toast('Testing key...');askAI('Reply with the single word OK.','Say OK').then(function(){toast('Key works!');},function(err){toast(err.message);});}
  else if(a==='aiRemove'){s.ai.key='';save();render();toast('Key removed from this device.');}
  else if(a==='reset'){if(state.ui.confirm==='reset'){state=fix(null);save();applyTheme();toast('All data erased.');}else state.ui.confirm='reset';render();}
}
function chg(a,el){
  var s=state.settings;
  if(a==='chartExam'){state.ui.chartExam=el.value;state.ui.chartPt=null;render();}
  else if(a==='logExam'){state.ui.logExam=el.value;render();}
  else if(a==='task'){
    state.plan.days.forEach(function(d){
      d.tasks.forEach(function(t){
        if(t.id===el.dataset.id){
          t.done=el.checked;
          if(el.checked){
            logActivity();
            if(t.topic){
              var v=state.rev[t.topic]||{n:0,last:''};
              v.n++;v.last=today();state.rev[t.topic]=v;
            }
          }
        }
      });
    });
    save();render();
  }
  else if(a==='setExam'){s.exam=el.value;save();render();}
  else if(a==='setDate'){s.examDate=el.value;save();}
  else if(a==='setTarget'){s.target=Math.min(100,Math.max(10,parseInt(el.value,10)||70));save();}
  else if(a==='setHours'){s.hours=parseFloat(el.value)||3;save();}
}

/* ---------- offline SW registration ---------- */
function registerOfflineSW(){
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    var swCode="var C='mocklens-cache-v2';self.addEventListener('install',function(e){e.waitUntil(caches.open(C).then(function(c){return c.addAll([location.href]);}));});self.addEventListener('fetch',function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(nr){var cl=nr.clone();caches.open(C).then(function(c){c.put(e.request,cl);});return nr;}).catch(function(){return caches.match(location.href);});}));});";
    try{
      var blob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
    }catch(e){}
  }
}

/* ---------- boot ---------- */
function boot(){
  state=load();state.ui.busy='';state.ui.confirm=null;state.ui.aiErr=null;save();applyTheme();
  document.getElementById('app').innerHTML='<div class="shell'+(state.settings.sideCollapsed?' collapsed':'')+'" id="shell"><aside class="side"><div class="side-hd"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 19v-8M12 19V5M19 19v-5"/></svg></span><span class="brand-txt">Mock Lens</span></div><button type="button" class="side-btn" data-act="toggleSide" title="Toggle sidebar" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button></div><nav class="nav" id="nav" aria-label="Main"></nav><div class="muted small side-foot" style="margin-top:auto">Data stays on this device.</div></aside><div class="mainwrap"><header class="top"><div class="l"><h1 style="font-size:1.1rem" class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 19v-8M12 19V5M19 19v-5"/></svg></span><span>Mock Lens</span></h1><span class="pill acc" id="exchip"></span></div><div class="r"><div class="timer-pill" id="top-timer"><span class="num" id="t-disp">15:00</span><button type="button" class="tbtn" id="t-toggle" data-act="timerToggle">Start</button><button type="button" class="tbtn" data-act="timerSet" data-m="15">15m</button><button type="button" class="tbtn" data-act="timerSet" data-m="25">25m</button></div><span id="net" class="pill"></span></div></header><main class="main" id="view"></main></div><nav class="bar" id="bar" aria-label="Main"></nav></div>';
  document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset,el);});
  document.addEventListener('input',function(e){
    if(e.target.closest&&e.target.closest('#logform'))liveLog();
    if(e.target.id==='err-search'){state.ui.errQ=e.target.value;render();var inp=document.getElementById('err-search');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  });
  document.addEventListener('change',function(e){
    var el=e.target;
    if(el.dataset&&el.dataset.chg)chg(el.dataset.chg,el);
    if(el.id==='b-file'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){importJson(String(fr.result));};fr.readAsText(el.files[0]);}
    if(el.id==='af-img'&&el.files&&el.files[0]){
      var file=el.files[0],fr2=new FileReader();
      fr2.onload=function(){
        var res=String(fr2.result),b64=res.split(',')[1];
        pendingImg={inlineData:{mimeType:file.type||'image/png',data:b64}};
        var lbl=document.getElementById('af-img-name');if(lbl)lbl.textContent=file.name;
      };
      fr2.readAsDataURL(file);
    }
  });
  window.addEventListener('hashchange',render);window.addEventListener('online',online);window.addEventListener('offline',online);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  registerOfflineSW();
  online();render();
}
window.__ml={boot:boot,get state(){return state;},testCalc:testCalc,rank:rank,genPlan:genPlan,insights:insights,render:render,curRoute:curRoute};
boot();
})();
</script>
